run_config:
  resume_from_checkpoint: false
  force_regenerate_data: false

curriculum:
  # Stage 0: Gaussian Pre-training (Analytical PSF)
  stage0:
    name: "Roman Bulge Stage 0 (Gaussian)"
    data_dir: "data/bulge_stage0_full"
    epochs: 100
    batch_size: 128
    learning_rate: 0.0001
    num_workers: 4
    resume_from_last_stage: false

  # Stage 1: Multi-Telescope Foundation (GalSim Optical PSFs)
  stage1:
    name: "Multi-Telescope Foundation (GalSim)"
    data_dir: "data/stage1_multitel"
    epochs: 50
    batch_size: 512
    learning_rate: 0.0001
    num_workers: 4
    resume_from_last_stage: true
    loss_params:
      lambda_diffraction_reg: 0.0 # No diffraction spikes in GalSim stage
    optical_randomization:
      pixel_scale_min: 0.05  
      pixel_scale_max: 0.4   
      fwhm_min: 0.8  
      fwhm_max: 5.0  
      max_shear: 0.15 
      moffat_beta_min: 2.0 
      moffat_beta_max: 4.5 
      obscuration_min: 0.0   
      obscuration_max: 0.4   
      strut_thick_max: 0.08 
      zernike_max: 0.15      
      jitter_sigma_max: 0.5  
      read_noise_min: 2.0
      read_noise_max: 15.0
      sky_mag_min: 20.0
      sky_mag_max: 23.0

  # Stage 2: Roman-specific High-Fidelity Fine-tuning (Romanisim)
  stage2:
    name: "Roman High-Fidelity Fine-tuning"
    data_dir: "data/stage2_romanisim"
    epochs: 50
    batch_size: 512
    learning_rate: 0.00001
    num_workers: 4
    resume_from_last_stage: true

data_params:
  # Samples to cover the unique parameter states
  num_train_samples: 110000 
  num_val_samples: 10000
  

  image_size: 256
  max_capacity_per_cell: 3
  GLOBAL_STRETCH_SCALE: 10.0
  min_snr: 5.0
  
  # Instrument & Observation Physics (Roman WFI Defaults)
  physics_params:
    pixel_scale: 0.11
    sigma_fixed: 0.405
    zp: 26.5
    sky_mag: 22.0
    read_noise: 5.0
    exp_time_min: 30.0
    exp_time_max: 90.0 # Increased range for domain randomization
    
  # Bulge Luminosity Function Simulation Bounds
  lf_params:
    m_min: 12.0
    m_max: 32.0
    rc_loc_min: 14.5
    rc_loc_max: 16.5
    rc_scale_min: 0.2
    rc_scale_max: 0.5
    rc_enh_min: 5.0
    rc_enh_max: 15.0
    gamma_min: 0.25
    gamma_max: 0.35
  
loss_params:
  # Focal loss values are naturally tiny. Multiply by 20 to bring 
  # the initial loss from ~0.08 up to ~1.6, forcing the network to care about detection.
  lambda_prob: 20.0 
  
  # Pos starts around ~2.0, which is healthy. Leave at 1.0.
  lambda_pos: 1.0   
  
  # Flux starts massive (~9.5). Scale it down to 0.2 to bring its initial 
  # impact down to ~1.9. This prevents Flux from hijacking the early gradients.
  lambda_flux: 0.2  
  
  # Background starts around 0.6. Scale by 2.0 to bring it to ~1.2.
  lambda_bg: 2.0    
  
  # Curvature and Entropy are microscopic (~0.003). They need a massive boost 
  # to actually enforce spatial smoothness on the background.
  lambda_curvature: 100.0
  lambda_entropy: 100.0
  
  lambda_diffraction_reg: 10.0
  focal_alpha: 0.50
  focal_gamma: 2.0