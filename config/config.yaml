run_config:
  resume_from_checkpoint: false
  force_regenerate_data: false


curriculum:
  # Stage 0: Gaussian Pre-training (The Base Model)
  # Uses the Two-Tier Speed Hack and Dynamic RC Prior
  stage0:
    name: "Roman Bulge Stage 0 (Full)"
    data_dir: "data/bulge_stage0_full"
    epochs: 500
    batch_size: 128
    learning_rate: 0.0001
    num_workers: 2
    resume_from_last_stage: false
    cell_size: 4 # Centralized default: 4
    mosaic_params:
      num_mosaics: 2000
      val_mosaics: 400
      mosaic_size: 1024

  # Stage 1: Multi-Telescope Foundation Training (GalSim)
  # Parameterized LF (Apparent Magnitudes) + Decoupled Instrument Physics
  stage1:
    name: "Multi-Telescope Foundation"
    data_dir: "data/stage1_multitel"
    epochs: 50
    batch_size: 512
    learning_rate: 0.0001
    num_workers: 4
    resume_from_last_stage: true
    mosaic_params:
      num_mosaics: 200
      val_mosaics: 20
      mosaic_size: 1024

  # Stage 2: Roman-specific High-Fidelity Fine-tuning (Romanisim)
  stage2:
    name: "Roman High-Fidelity Fine-tuning"
    data_dir: "data/stage2_romanisim"
    epochs: 50
    batch_size: 512
    learning_rate: 0.00001
    num_workers: 4
    resume_from_last_stage: true

data_params:
  # Samples to cover the unique parameter states
  num_train_samples: 50000 
  num_val_samples: 5000
  
  # Massive unified population to hit VVV background levels
  min_stars: 50000
  max_stars: 300000
  
  image_size: 256
  
  # Model-dependent constants (Aligned with castor.constants)
  max_capacity_per_cell: 3
  shape_size: 31
  GLOBAL_STRETCH_SCALE: 10.0
  
  # Rendering & PSF Generation
  n_library_psfs: 100
  min_snr: 5.0
  
  # Instrument & Observation Physics (Roman WFI Defaults)
  physics_params:
    pixel_scale: 0.11
    sigma_fixed: 1.5
    zp: 26.5
    sky_mag: 22.0
    read_noise: 5.0
    exp_time_min: 30.0
    exp_time_max: 60.0
    
  # Bulge Luminosity Function Simulation Bounds
  lf_params:
    m_min: 12.0
    m_max: 32.0
    rc_loc_min: 14.5
    rc_loc_max: 16.5
    rc_scale_min: 0.2
    rc_scale_max: 0.5
    rc_enh_min: 5.0
    rc_enh_max: 15.0
    gamma_min: 0.25
    gamma_max: 0.35
  
loss_params:
  lambda_prob: 25.0
  lambda_pos: 25.0      # Increased: NLL scales differently than Smooth L1
  lambda_flux: 10.0     # Increased: Balancing astrometry vs photometry
  lambda_bg: 0.5
  lambda_diffraction_reg: 10.0
  focal_alpha: 0.25
  focal_gamma: 2.0
