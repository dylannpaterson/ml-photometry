[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "castor"
version = "0.1.0"
description = "Roman Point Source ML Pipeline Training & Research"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pyyaml",
    "astropy",
    "pandas",
    "matplotlib",
    "tqdm",
    "scipy",
    "pyarrow",
]

[tool.setuptools]
packages = ["castor", "castor.cloud", "castor.data", "castor.engine", "castor.models"]
